name: Publish versioned releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_checks:
    uses: ./.github/workflows/quality.yml

  build:
    needs: source_checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stream.fgc
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: stream.fgc
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix .github ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact tag, main ancestry, and release ownership
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs --check
      - uses: actions/setup-go@v5
        with:
          go-version-file: stream.fgc/go.mod
          cache-dependency-path: stream.fgc/go.sum
      - name: Test controller and overlay contracts
        run: |
          go test -short -timeout 2m ./backend
          go vet ./backend
          node --test __tests__/*.test.js
      - name: Build Windows x64 controller with the project's Wails version
        run: |
          wailsVersion=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go run "github.com/wailsapp/wails/v2/cmd/wails@${wailsVersion}" build -clean -platform windows/amd64 -webview2 download
      - name: Build release preview or tagged distributions
        run: node .github/scripts/build.mjs --binary build/bin/stream.fgc.exe
      - name: Test generated release
        timeout-minutes: 5
        run: npm --prefix .github run release:test
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release
          path: stream.fgc/dist/assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source_checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: dist/assets/
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs --publish
