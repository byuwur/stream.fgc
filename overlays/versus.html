<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Stream.FGC Versus Overlay</title>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<link rel="stylesheet" href="css/animate.min.css" />
		<link rel="stylesheet" href="css/_common.css" />
		<link rel="stylesheet" href="css/overlay.css" />
		<script defer src="js/jquery.min.js"></script>
		<script defer src="js/popper.min.js"></script>
		<script defer src="js/bootstrap.min.js"></script>
		<script defer src="js/overlay.js"></script>
	</head>
	<body data-overlay-page="versus" data-poll-ms="1000">
		<main class="fgc-stage d-flex align-items-center justify-content-between">
			<section class="fgc-panel versus-card rounded p-4 text-start">
				<div class="d-flex align-items-center gap-4">
					<img class="fgc-portrait" data-p1-portrait alt="" />
					<div>
						<img class="fgc-country mb-3" data-p1-flag alt="" />
						<div class="fgc-name" data-p1-name>TBD</div>
						<div class="fgc-team" data-p1-team></div>
						<div class="fgc-subtitle mt-3" data-p1-character></div>
					</div>
				</div>
			</section>

			<div class="fgc-vs">VS</div>

			<section class="fgc-panel versus-card rounded p-4 text-end">
				<div class="d-flex flex-row-reverse align-items-center gap-4">
					<img class="fgc-portrait" data-p2-portrait alt="" />
					<div>
						<img class="fgc-country mb-3" data-p2-flag alt="" />
						<div class="fgc-name" data-p2-name>TBD</div>
						<div class="fgc-team" data-p2-team></div>
						<div class="fgc-subtitle mt-3" data-p2-character></div>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
