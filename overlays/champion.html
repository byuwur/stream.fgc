<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Stream.FGC Champion Overlay</title>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<link rel="stylesheet" href="css/animate.min.css" />
		<link rel="stylesheet" href="css/_common.css" />
		<link rel="stylesheet" href="css/overlay.css" />
		<script defer src="js/jquery.min.js"></script>
		<script defer src="js/popper.min.js"></script>
		<script defer src="js/bootstrap.min.js"></script>
		<script defer src="js/overlay.js"></script>
	</head>
	<body data-overlay-page="champion" data-poll-ms="1000">
		<main class="fgc-stage d-flex align-items-center justify-content-center">
			<section class="fgc-panel rounded p-5 text-center" data-champion-panel>
				<div class="fgc-eyebrow mb-3">Tournament Champion</div>
				<img class="fgc-logo mb-4" data-tournament-logo alt="" />
				<img class="fgc-portrait mb-4" data-champion-portrait alt="" />
				<h1 class="fgc-title" data-champion-name>TBD</h1>
				<div class="fgc-subtitle mt-3" data-event-name></div>
			</section>
		</main>
	</body>
</html>
